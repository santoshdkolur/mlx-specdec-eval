[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-bench"
version = "0.1.0"
description = "A lightweight CLI benchmarking tool to measure and profile Speculative Decoding on Apple Silicon with MLX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SpecBench Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mlx>=0.18.0",
    "mlx-lm>=0.18.0",
    "transformers>=4.38.0",
    "huggingface_hub>=0.20.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
spec-bench = "spec_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spec_bench*"]
